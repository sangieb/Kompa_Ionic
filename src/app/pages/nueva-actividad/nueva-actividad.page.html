<ion-header class="ion-no-border">
  <ion-toolbar class="toolbar-blanca">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text=""></ion-back-button>
    </ion-buttons>
    <ion-title class="titulo">Nueva actividad</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="formulario">
    <ion-input class="campo" fill="outline" label="Nombre de la actividad" labelPlacement="floating"
      autocapitalize="sentences" [value]="nombre" (ionInput)="nombre = $any($event).detail.value ?? ''">
    </ion-input>

    <!-- Foto del grupo: taller 4.3 -->
    <h2 class="etiqueta">Foto del grupo</h2>
    <button type="button" class="foto" aria-label="Foto del grupo" (click)="tomarFotografia()">
      @if (fotoUri()) {
        <img [src]="fotoUri()" alt="Foto del grupo" />
      } @else {
        <ion-icon name="image-outline"></ion-icon>
        <span>No hay foto.</span>
      }
    </button>
    <div class="botones-foto">
      <ion-button fill="outline" class="boton-foto" (click)="tomarFotografia()">
        <ion-icon slot="start" name="camera"></ion-icon>
        Cámara
      </ion-button>
      <ion-button fill="outline" class="boton-foto" (click)="elegirDeGaleria()">
        <ion-icon slot="start" name="images"></ion-icon>
        Galería
      </ion-button>
    </div>

    <!-- Ubicación -->
    <h2 class="etiqueta">Ubicación</h2>
    <p class="ayuda kompa-texto-gris">Escribe una dirección o toca el mapa para fijar la ubicación</p>
    <div #mapa class="mapa"></div>

    <ion-input class="campo" fill="outline" label="Ubicación" labelPlacement="floating"
      enterkeyhint="search" [value]="ubicacion()"
      (ionInput)="ubicacion.set($any($event).detail.value ?? '')"
      (keyup.enter)="buscarDireccion()">
      <ion-button slot="end" fill="clear" aria-label="Buscar dirección"
        [disabled]="buscando()" (click)="buscarDireccion()">
        <ion-icon slot="icon-only" name="search"></ion-icon>
      </ion-button>
    </ion-input>

    <!-- Resto de datos -->
    <ion-textarea class="campo" fill="outline" label="Descripción" labelPlacement="floating"
      [autoGrow]="true" [rows]="3"
      [value]="descripcion" (ionInput)="descripcion = $any($event).detail.value ?? ''">
    </ion-textarea>

    <ion-input class="campo" fill="outline" label="Duración (minutos)" labelPlacement="floating"
      type="number" inputmode="numeric" min="1"
      [value]="duracionTexto" (ionInput)="duracionTexto = $any($event).detail.value ?? ''">
    </ion-input>

    <ion-input class="campo" fill="outline" label="Fecha y hora de la actividad" labelPlacement="stacked"
      type="datetime-local" [min]="fechaMinima"
      [value]="fechaTexto" (ionInput)="fechaTexto = $any($event).detail.value ?? ''">
    </ion-input>

    <ion-button expand="block" class="kompa-boton boton-guardar" [disabled]="guardando()" (click)="guardar()">
      Guardar actividad
    </ion-button>
  </div>
</ion-content>
