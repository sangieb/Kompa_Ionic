<ion-header class="ion-no-border">
  <ion-toolbar class="toolbar-blanca">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/recuperar" text=""></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="formulario" [formGroup]="formulario">
    <h1 class="titulo">Nueva contraseña</h1>
    <p class="descripcion kompa-texto-gris">Elige una nueva contraseña para tu cuenta de Kompa.</p>

    <ion-input
      class="campo"
      fill="outline"
      label="Nueva contraseña"
      labelPlacement="floating"
      type="password"
      [autocomplete]="false"
      formControlName="password"
    >
      <ion-input-password-toggle slot="end"></ion-input-password-toggle>
    </ion-input>

    <ion-input
      class="campo"
      fill="outline"
      label="Confirmar nueva contraseña"
      labelPlacement="floating"
      type="password"
      [autocomplete]="false"
      formControlName="confirmar"
    >
      <ion-input-password-toggle slot="end"></ion-input-password-toggle>
    </ion-input>

    <ion-button expand="block" class="kompa-boton boton-enviar" [disabled]="cargando()" (click)="enviar()">
      Actualizar contraseña
    </ion-button>
  </div>
</ion-content>
