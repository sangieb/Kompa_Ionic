<ion-header class="ion-no-border">
  <ion-toolbar class="toolbar-blanca">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio" text=""></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="formulario" [formGroup]="formulario">
    <h1 class="titulo">Bienvenido de nuevo</h1>
    <p class="subtitulo kompa-texto-gris">Inicia sesión para encontrar a tu próximo Kompa de viaje</p>

    <ion-input
      class="campo primer-campo"
      fill="outline"
      label="Correo electrónico"
      labelPlacement="floating"
      type="email"
      inputmode="email"
      autocomplete="email"
      formControlName="correo"
    >
    </ion-input>

    <ion-input
      class="campo"
      fill="outline"
      label="Contraseña"
      labelPlacement="floating"
      type="password"
      autocomplete="current-password"
      formControlName="password"
    >
      <ion-input-password-toggle slot="end"></ion-input-password-toggle>
    </ion-input>

    <ion-button expand="block" class="kompa-boton boton-login" [disabled]="cargando()" (click)="iniciarSesion()">
      Iniciar sesión
    </ion-button>

    <button type="button" class="link-olvide" (click)="irARecuperar()">Olvidé mi contraseña</button>
  </div>
</ion-content>
