<nav class="barra" aria-label="Navegación principal">
  @for (tab of tabs; track tab.route) {
    <a class="pestana" [routerLink]="tab.route" routerLinkActive="activa" [ariaCurrentWhenActive]="'page'">
      <ion-icon [name]="tab.icon" aria-hidden="true"></ion-icon>
      <span>{{ tab.label }}</span>
    </a>
  }
</nav>
